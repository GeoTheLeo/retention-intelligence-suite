name: Keep Streamlit App Warm

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Cloud app
        run: |
          curl -sSf --max-time 30 \
            "https://retention-intelligence-suite-72t6lqznkxpa6mes2uqy6n.streamlit.app/" \
            > /dev/null
